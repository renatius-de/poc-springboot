apiVersion: v1
kind: Secret
metadata:
  name: rest-postgres-credentials
  namespace: load-testing
type: Opaque
stringData:
  POSTGRES_DB: restdb
  POSTGRES_USER: restapp
  POSTGRES_PASSWORD: rest-local-db-password
---
apiVersion: v1
kind: Secret
metadata:
  name: grpc-postgres-credentials
  namespace: load-testing
type: Opaque
stringData:
  POSTGRES_DB: grpcdb
  POSTGRES_USER: grpcapp
  POSTGRES_PASSWORD: grpc-local-db-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rest-postgres-data
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest-postgres
    app.kubernetes.io/part-of: poc-springboot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grpc-postgres-data
  namespace: load-testing
  labels:
    app.kubernetes.io/name: grpc-postgres
    app.kubernetes.io/part-of: poc-springboot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-postgres
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: poc-springboot
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: rest-postgres-credentials
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: rest-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: rest-postgres
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: poc-springboot
spec:
  selector:
    app.kubernetes.io/name: rest-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
