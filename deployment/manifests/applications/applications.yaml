apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: poc-springboot
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h rest-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "Waiting for REST PostgreSQL"; sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rest-postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rest-postgres-credentials
                  key: POSTGRES_USER
      containers:
        - name: rest
          image: poc-springboot-rest:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://rest-postgres:5432/restdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rest-postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rest-postgres-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rest-service
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: poc-springboot
spec:
  selector:
    app.kubernetes.io/name: rest
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc
  namespace: load-testing
  labels:
    app.kubernetes.io/name: grpc
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grpc
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: poc-springboot
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h grpc-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "Waiting for gRPC PostgreSQL"; sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: grpc-postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: grpc-postgres-credentials
                  key: POSTGRES_USER
      containers:
        - name: grpc
          image: poc-springboot-grpc:local
          imagePullPolicy: Never
          ports:
            - name: grpc
              containerPort: 9090
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://grpc-postgres:5432/grpcdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grpc-postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grpc-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: GRPC_SERVER_PORT
              value: "9090"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-service
  namespace: load-testing
  labels:
    app.kubernetes.io/name: grpc
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: poc-springboot
spec:
  selector:
    app.kubernetes.io/name: grpc
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
