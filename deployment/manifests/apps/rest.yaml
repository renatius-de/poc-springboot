apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest
        app.kubernetes.io/part-of: poc-springboot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: rest
          image: poc-springboot-rest:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://rest-postgres-service:5432/restdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rest-postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rest-postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rest-service
  namespace: load-testing
  labels:
    app.kubernetes.io/name: rest
    app.kubernetes.io/part-of: poc-springboot
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: rest
  ports:
    - name: http
      port: 8080
      targetPort: http
