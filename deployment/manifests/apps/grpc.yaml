apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc
  namespace: load-testing
  labels:
    app.kubernetes.io/name: grpc
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: grpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grpc
        app.kubernetes.io/part-of: poc-springboot
    spec:
      containers:
        - name: grpc
          image: poc-springboot-grpc:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://grpc-postgres-service:5432/grpcdb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grpc-postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grpc-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: GRPC_SERVER_PORT
              value: "9090"
            - name: SERVER_PORT
              value: "8081"
          ports:
            - name: grpc
              containerPort: 9090
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-service
  namespace: load-testing
  labels:
    app.kubernetes.io/name: grpc
    app.kubernetes.io/part-of: poc-springboot
spec:
  # Headless: DNS returns all pod IPs so gRPC clients can balance client-side
  # (use target dns:///grpc-service.load-testing.svc.cluster.local:9090 with round_robin).
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: grpc
  ports:
    - name: grpc
      appProtocol: kubernetes.io/h2c
      port: 9090
      targetPort: grpc
    - name: management
      port: 8081
      targetPort: management
