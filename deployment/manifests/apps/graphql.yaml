apiVersion: v1
kind: Secret
metadata:
  name: graphql-api-key
  namespace: load-testing
  labels:
    app.kubernetes.io/name: graphql
    app.kubernetes.io/part-of: poc-springboot
type: Opaque
stringData:
  APP_SECURITY_API_KEY: benchmark-api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql
  namespace: load-testing
  labels:
    app.kubernetes.io/name: graphql
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql
        app.kubernetes.io/part-of: poc-springboot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8085"
    spec:
      containers:
        - name: graphql
          image: poc-springboot-graphql:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local,postgresql
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://graphql-postgres-service:5432/graphqldb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: graphql-postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphql-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: APP_SECURITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: graphql-api-key
                  key: APP_SECURITY_API_KEY
            - name: APP_SECURITY_CORS_ALLOWED_ORIGINS
              value: http://localhost:3000
          ports:
            - name: http
              containerPort: 8084
            - name: management
              containerPort: 8085
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-service
  namespace: load-testing
  labels:
    app.kubernetes.io/name: graphql
    app.kubernetes.io/part-of: poc-springboot
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: graphql
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: management
      port: 8085
      targetPort: management
