apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: load-testing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: poc-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: poc-springboot
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: pocspringboot
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              value: app
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "pocspringboot"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: load-testing
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: poc-springboot
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
