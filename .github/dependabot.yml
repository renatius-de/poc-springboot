---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      maven-dependencies:
        patterns:
          - "*"
