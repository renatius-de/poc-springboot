---
name: Super-Linter

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint GitHub configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Super-Linter environment
        run: |
          if [ -f .github/super-linter.env ]; then
            while IFS='=' read -r key value; do
              [ -z "$key" ] && continue
              case "$key" in
                \#*)
                  continue
                  ;;
                DEFAULT_BRANCH|IGNORE_GENERATED_FILES|IGNORE_GITIGNORED_FILES|VALIDATE_JSCPD|VALIDATE_KOTLIN_ANDROID|VALIDATE_SHELL_SHFMT|VALIDATE_SQLFLUFF)
                  printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
                  ;;
              esac
            done < .github/super-linter.env
          fi

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          FILTER_REGEX_INCLUDE: ^\.github/
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
