---
name: Super-Linter

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint GitHub configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          FILTER_REGEX_INCLUDE: ^\.github/
          IGNORE_GENERATED_FILES: true
          IGNORE_GITIGNORED_FILES: true
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_JSCPD: false
          VALIDATE_KOTLIN_ANDROID: false
          VALIDATE_MARKDOWN: true
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_SQLFLUFF: false
          VALIDATE_YAML: true
