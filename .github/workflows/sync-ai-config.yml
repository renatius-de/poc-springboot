---
name: Sync AI Config

on:
  schedule:
    - cron: "0 5 15 * *"
  workflow_dispatch:

concurrency:
  group: sync-ai-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync AI config from dotfiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout dotfiles repository
        uses: actions/checkout@v7
        with:
          repository: renatius-de/dotfiles
          path: dotfiles-source
          token: ${{ secrets.DOTFILES_TOKEN || github.token }}
          sparse-checkout: ai
          persist-credentials: false

      - name: Copy AI files
        run: |
          for dir in skills instructions prompts; do
            if [ ! -d "dotfiles-source/ai/${dir}" ]; then
              echo "::warning::Directory ai/${dir} not found in renatius-de/dotfiles, skipping"
              continue
            fi
            mkdir -p ".github/${dir}"
            cp -R "dotfiles-source/ai/${dir}/." ".github/${dir}/"
          done
          rm -rf dotfiles-source

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            .github/skills
            .github/instructions
            .github/prompts
          branch: chore/sync-ai-config
          commit-message: "chore(ai): sync AI config from dotfiles"
          title: "chore(ai): sync AI config from dotfiles"
          body: |
            Automated sync of the `skills`, `instructions` and `prompts` subdirectories
            of the `ai` directory in `renatius-de/dotfiles` into the matching
            subdirectories of `.github/`.
          labels: dependencies
          delete-branch: true
