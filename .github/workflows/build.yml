---
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto
          cache: gradle

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Ensure Gradle Wrapper is executable
        run: chmod +x ./gradlew

      - name: Build and verify with Gradle Wrapper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon clean build

      - name: Upload Gradle build output
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build
          path: "**/build/"
          if-no-files-found: error
          retention-days: 7

  artifact-consumer:
    name: Verify downloaded build artifact
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Gradle build output
        uses: actions/download-artifact@v4.1.3
        with:
          name: gradle-build
          path: app-artifact

      - name: Confirm build output is available
        run: test -n "$(find app-artifact -type f -name '*.jar' -print -quit)"
