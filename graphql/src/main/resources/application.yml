server:
  port: 8084

spring:
  graphql:
    graphiql:
      enabled: true
    path: /graphql

management:
  server:
    port: 8085
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo.observability:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    correlation: "[trace_id=%X{traceId} span_id=%X{spanId}] "
  include-application-name: true

app:
  security:
    api-key: ${APP_SECURITY_API_KEY:local-api-key}
    cors-allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
