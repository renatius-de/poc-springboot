services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pocspringboot
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: pocspringboot
    ports:
      - "27017:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rest:
    build:
      context: .
      dockerfile: docker/Dockerfile.rest
    environment:
      SPRING_PROFILES_ACTIVE: local,postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pocspringboot
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      APP_SECURITY_API_KEY: local-api-key
      APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  grpc:
    build:
      context: .
      dockerfile: docker/Dockerfile.grpc
    environment:
      SPRING_PROFILES_ACTIVE: local,postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pocspringboot
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      GRPC_SERVER_PORT: 9090
      SERVER_PORT: 8081
      APP_SECURITY_API_KEY: local-api-key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  graphql:
    build:
      context: .
      dockerfile: docker/Dockerfile.graphql
    environment:
      SPRING_PROFILES_ACTIVE: local,postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pocspringboot
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      APP_SECURITY_API_KEY: local-api-key
      APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
